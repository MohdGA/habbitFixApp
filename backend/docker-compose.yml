version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: quitly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quitly_db
      POSTGRES_USER: quitly
      POSTGRES_PASSWORD: quitly_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quitly -d quitly_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quitly_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quitly_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://quitly:quitly_pass@postgres:5432/quitly_db
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - ./keys:/app/keys:ro

volumes:
  postgres_data:
  redis_data:

name: habbitfix
description: Fix your habits. Every day — with AI coaching.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.1.4

  # Networking
  dio: ^5.4.3+1

  # Local storage
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Charts
  fl_chart: ^0.68.0

  # Firebase (FCM)
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.2.2

  # UI utilities
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  haptic_feedback: ^0.5.1+1
  intl: ^0.19.0
  timeago: ^3.6.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2

  # Offline & connectivity
  connectivity_plus: ^6.0.5

  # Biometrics
  local_auth: ^2.3.0

  # Sharing
  share_plus: ^9.0.0

  # Timezone support
  timezone: ^0.9.4

  # Code generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  uuid: ^4.4.0
  equatable: ^2.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
